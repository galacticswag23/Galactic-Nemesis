<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>GN - ELITE VISUAL DRAFT</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@600;700&display=swap');

        :root {
            --neon-blue: #00f2ff; --neon-red: #ff4655; --neon-gold: #c89b3c; --bg-dark: #02060a;
        }

        body {
            background: var(--bg-dark); color: white; font-family: 'Rajdhani', sans-serif;
            margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh;
            overflow-x: hidden;
        }

        /* OVERLAY DI SISTEMA */
        #overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.98); z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            border: 4px solid var(--neon-gold); box-sizing: border-box;
        }

        .header {
            width: 100%; background: #000; border-bottom: 3px solid var(--neon-gold);
            padding: 15px; text-align: center; font-family: 'Orbitron'; box-shadow: 0 0 20px rgba(200, 155, 60, 0.3);
        }

        .status-bar { display: flex; gap: 50px; align-items: center; margin: 15px 0; }
        .timer { font-size: 3.5rem; font-family: 'Orbitron'; color: var(--neon-red); text-shadow: 0 0 15px var(--neon-red); min-width: 180px; text-align: center; }
        .turn-msg { font-family: 'Orbitron'; font-size: 1.4rem; color: var(--neon-gold); text-transform: uppercase; }

        .main-container {
            display: grid; grid-template-columns: 240px 1fr 240px; gap: 20px; width: 95%; max-width: 1600px;
        }

        /* BAN SLOTS */
        .side-panel h3 { font-family: 'Orbitron'; font-size: 1rem; border-bottom: 1px solid #333; padding-bottom: 10px; margin-bottom: 10px; }
        .ban-slot {
            background: rgba(255,255,255,0.03); border: 1px solid #222; height: 50px;
            margin-bottom: 8px; display: flex; align-items: center; justify-content: center;
            font-family: 'Orbitron'; font-size: 0.8rem; transition: 0.3s; text-transform: uppercase;
            overflow: hidden; gap: 10px;
        }
        .ban-slot img { width: 40px; height: 40px; object-fit: cover; border: 1px solid #444; }
        .ban-slot.active { border-color: var(--neon-blue); box-shadow: 0 0 10px var(--neon-blue); background: rgba(0, 242, 255, 0.1); }
        .ban-slot.filled { color: var(--neon-red); border: 1px solid var(--neon-red); background: rgba(255, 70, 85, 0.1); }

        /* GRID CAMPIONI */
        .selection-area { display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .search-box {
            width: 100%; background: #000; border: 2px solid var(--neon-blue);
            color: white; padding: 12px; font-family: 'Orbitron'; font-size: 1rem; text-align: center;
            box-shadow: 0 0 10px rgba(0, 242, 255, 0.2);
        }

        .champ-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(85px, 1fr));
            gap: 10px; width: 100%; max-height: 450px; overflow-y: auto;
            padding: 15px; background: rgba(0,0,0,0.5); border: 1px solid #222;
        }

        .champ-btn {
            background: #111; border: 1px solid #333; color: #ccc; 
            cursor: pointer; transition: 0.2s; padding: 5px;
            display: flex; flex-direction: column; align-items: center; gap: 5px;
        }
        .champ-btn img { width: 60px; height: 60px; border: 1px solid #444; transition: 0.2s; }
        .champ-btn:hover { border-color: var(--neon-gold); transform: translateY(-3px); }
        .champ-btn:hover img { border-color: var(--neon-gold); }
        .champ-btn span { font-size: 0.65rem; font-weight: bold; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; }

        /* FEARLESS BOXES */
        .fearless-container {
            grid-column: 1 / 4; margin-top: 20px; padding: 20px;
            border-top: 2px dashed #333; width: 100%; display: grid;
            grid-template-columns: 1fr 1fr 1fr; gap: 15px;
        }
        .fearless-box { background: rgba(255,255,255,0.02); padding: 15px; border: 1px solid #222; }
        .fearless-box h4 { font-family: 'Orbitron'; color: var(--neon-gold); margin: 0 0 10px 0; font-size: 0.8rem; text-align: center; }
        .fearless-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
        .fearless-select {
            width: 100%; background: #000; color: var(--neon-blue); border: 1px solid #444;
            padding: 5px; font-family: 'Rajdhani'; font-weight: bold; font-size: 0.8rem;
        }

        .btn-reset {
            grid-column: 1 / 4; justify-self: center; background: none; border: 1px solid #444;
            color: #444; padding: 10px 30px; cursor: pointer; font-family: 'Orbitron'; font-size: 0.8rem; margin-top: 10px;
        }
        .btn-reset:hover { color: var(--neon-red); border-color: var(--neon-red); }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-thumb { background: var(--neon-blue); border-radius: 4px; }
    </style>
</head>
<body>

    <div id="overlay">
        <h2 style="font-family:'Orbitron'; color:var(--neon-gold); letter-spacing:5px; text-shadow: 0 0 20px var(--neon-gold);">SISTEMA BLOCCATO</h2>
        <p style="font-family:'Rajdhani'; color:#555;">In attesa dell'inizializzazione del protocollo...</p>
        <button onclick="activateProtocol()" style="margin-top:30px; padding:15px 40px; background:none; border:2px solid var(--neon-blue); color:var(--neon-blue); font-family:'Orbitron'; cursor:pointer; box-shadow: 0 0 15px var(--neon-blue);">START BAN PHASE</button>
    </div>

    <div class="header"><h1>GALACTIC NEMESIS - ELITE DRAFT</h1></div>

    <div class="status-bar">
        <div id="turn-display" class="turn-msg">CONNECTING...</div>
        <div id="timer" class="timer">60</div>
    </div>

    <div class="main-container">
        <div class="side-panel">
            <h3 style="color: var(--neon-blue)">TEAM A BANS</h3>
            <div class="ban-slot" id="slotA1">-</div><div class="ban-slot" id="slotA2">-</div>
            <div class="ban-slot" id="slotA3">-</div><div class="ban-slot" id="slotA4">-</div>
            <div class="ban-slot" id="slotA5">-</div>
        </div>

        <div class="selection-area">
            <input type="text" id="filterInput" class="search-box" placeholder="RICERCA CAMPIONE..." oninput="filterChamps()">
            <div class="champ-grid" id="champGrid"></div>
        </div>

        <div class="side-panel" style="text-align: right;">
            <h3 style="color: var(--neon-red)">TEAM B BANS</h3>
            <div class="ban-slot" id="slotB1">-</div><div class="ban-slot" id="slotB2">-</div>
            <div class="ban-slot" id="slotB3">-</div><div class="ban-slot" id="slotB4">-</div>
            <div class="ban-slot" id="slotB5">-</div>
        </div>

        <div class="fearless-container">
            <div class="fearless-box"><h4>GAME 1 FEARLESS</h4><div class="fearless-grid"><select class="fearless-select" id="f1_1" onchange="syncFearless()"><option value="">- P1 -</option></select><select class="fearless-select" id="f1_2" onchange="syncFearless()"><option value="">- P2 -</option></select><select class="fearless-select" id="f1_3" onchange="syncFearless()"><option value="">- P3 -</option></select><select class="fearless-select" id="f1_4" onchange="syncFearless()"><option value="">- P4 -</option></select></div></div>
            <div class="fearless-box"><h4>GAME 2 FEARLESS</h4><div class="fearless-grid"><select class="fearless-select" id="f2_1" onchange="syncFearless()"><option value="">- P1 -</option></select><select class="fearless-select" id="f2_2" onchange="syncFearless()"><option value="">- P2 -</option></select><select class="fearless-select" id="f2_3" onchange="syncFearless()"><option value="">- P3 -</option></select><select class="fearless-select" id="f2_4" onchange="syncFearless()"><option value="">- P4 -</option></select></div></div>
            <div class="fearless-box"><h4>GAME 3 FEARLESS</h4><div class="fearless-grid"><select class="fearless-select" id="f3_1" onchange="syncFearless()"><option value="">- P1 -</option></select><select class="fearless-select" id="f3_2" onchange="syncFearless()"><option value="">- P2 -</option></select><select class="fearless-select" id="f3_3" onchange="syncFearless()"><option value="">- P3 -</option></select><select class="fearless-select" id="f3_4" onchange="syncFearless()"><option value="">- P4 -</option></select></div></div>
            <button class="btn-reset" onclick="resetBanPhase()">RESET PROTOCOL</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDNRL0Rbo58WPjII0BzSRQZ1M7ZJ9MdsY4",
            authDomain: "galactic-nemesis-7bee5.firebaseapp.com",
            projectId: "galactic-nemesis-7bee5",
            storageBucket: "galactic-nemesis-7bee5.firebasestorage.app",
            messagingSenderId: "265814903052",
            appId: "1:265814903052:web:6c59477e9852e91387a129",
            databaseURL: "https://galactic-nemesis-7bee5-default-rtdb.europe-west1.firebasedatabase.app"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const banRef = db.ref('ban_phase_2vs2_v3_icons');

        const allChampions = ["Aatrox", "Ahri", "Akali", "Akshan", "Alistar", "Ambessa", "Amumu", "Anivia", "Annie", "Aphelios", "Ashe", "Aurelion Sol", "Azir", "Bard", "Bel'Veth", "Blitzcrank", "Brand", "Braum", "Briar", "Caitlyn", "Camille", "Cassiopeia", "Cho'Gath", "Corki", "Darius", "Diana", "Dr. Mundo", "Draven", "Ekko", "Elise", "Evelynn", "Ezreal", "Fiddlesticks", "Fiora", "Fizz", "Galio", "Gangplank", "Garen", "Gnar", "Gragas", "Graves", "Gwen", "Hecarim", "Heimerdinger", "Hwei", "Illaoi", "Irelia", "Ivern", "Janna", "Jarvan IV", "Jax", "Jayce", "Jhin", "Jinx", "K'Sante", "Kai'Sa", "Kalista", "Karma", "Karthus", "Kassadin", "Katarina", "Kayle", "Kayn", "Kennen", "Kha'Zix", "Kindred", "Kled", "Kog'Maw", "LeBlanc", "Lee Sin", "Leona", "Lillia", "Lissandra", "Lucian", "Lulu", "Lux", "Malphite", "Malzahar", "Maokai", "Master Yi", "Milio", "Miss Fortune", "Mordekaiser", "Morgana", "Naafiri", "Nami", "Nasus", "Nautilus", "Neeko", "Nidalee", "Nilah", "Nocturne", "Nunu & Willump", "Olaf", "Orianna", "Ornn", "Pantheon", "Poppy", "Pyke", "Qiyana", "Quinn", "Rakan", "Rammus", "Rek'Sai", "Rell", "Renata Glasc", "Renekton", "Rengar", "Riven", "Rumble", "Ryze", "Samira", "Sejuani", "Senna", "Seraphine", "Sett", "Shaco", "Shen", "Shyvana", "Singed", "Sion", "Sivir", "Skarner", "Smolder", "Sona", "Soraka", "Swain", "Sylas", "Syndra", "Tahm Kench", "Taliyah", "Talon", "Taric", "Teemo", "Thresh", "Tristana", "Trundle", "Tryndamere", "Twisted Fate", "Twitch", "Udyr", "Urgot", "Varus", "Vayne", "Veigar", "Vel'Koz", "Vex", "Vi", "Viego", "Viktor", "Vladimir", "Volibear", "Warwick", "Wukong", "Xayah", "Xerath", "Xin Zhao", "Yasuo", "Yone", "Yorick", "Yuumi", "Zac", "Zed", "Zeri", "Ziggs", "Zilean", "Zoe", "Zyra"];

        let currentPhase = -1;
        let timerInterval;
        const phaseOrder = ['slotA1', 'slotB1', 'slotA2', 'slotB2', 'slotA3', 'slotB3', 'slotA4', 'slotB4', 'slotA5', 'slotB5'];

        function getIconUrl(name) {
            let imgName = name.replace(/\s+/g, '').replace("'", "").replace(".", "");
            if(imgName === "Wukong") imgName = "MonkeyKing";
            if(imgName === "LeBlanc") imgName = "Leblanc";
            if(imgName === "KhaZix") imgName = "Khazix";
            if(imgName === "ChoGath") imgName = "Chogath";
            if(imgName === "KaiSa") imgName = "Kaisa";
            if(imgName === "KSante") imgName = "Ksante";
            if(imgName === "BelVeth") imgName = "Belveth";
            if(imgName === "Nunu&Willump") imgName = "Nunu";
            if(imgName === "VelKoz") imgName = "Velkoz";
            if(imgName === "RenataGlasc") imgName = "Renata";
            return `https://ddragon.leagueoflegends.com/cdn/14.22.1/img/champion/${imgName}.png`;
        }

        function activateProtocol() {
            banRef.update({ status: "ACTIVE", currentPhase: 0 });
        }

        function startTimer() {
            clearInterval(timerInterval);
            let time = 60;
            const timerEl = document.getElementById('timer');
            timerInterval = setInterval(() => {
                time--; timerEl.innerText = time;
                if (time <= 0) { clearInterval(timerInterval); timerEl.innerText = "UP"; }
            }, 1000);
        }

        function selectChamp(name) {
            banRef.once('value', (snap) => {
                const phase = snap.val().currentPhase || 0;
                if (phase >= 10) return;
                banRef.update({ [phaseOrder[phase]]: name, currentPhase: phase + 1 });
            });
        }

        function syncFearless() {
            const fearlessData = {};
            document.querySelectorAll('.fearless-select').forEach(sel => fearlessData[sel.id] = sel.value);
            banRef.update({ fearless: fearlessData });
        }

        function resetBanPhase() {
            if(confirm("Reset Protocollo?")) {
                clearInterval(timerInterval);
                const resetObj = { status: "IDLE", currentPhase: 0 };
                phaseOrder.forEach(id => resetObj[id] = "");
                banRef.update(resetObj);
            }
        }

        banRef.on('value', (snap) => {
            const data = snap.val() || {};
            const newPhase = data.currentPhase || 0;
            document.getElementById('overlay').style.display = (data.status === "ACTIVE") ? "none" : "flex";

            if (data.fearless) {
                Object.keys(data.fearless).forEach(id => {
                    const sel = document.getElementById(id);
                    if(sel) sel.value = data.fearless[id];
                });
            }

            phaseOrder.forEach((id, idx) => {
                const el = document.getElementById(id);
                el.classList.remove('active', 'filled');
                if (data[id]) { 
                    el.innerHTML = `<img src="${getIconUrl(data[id])}"> <span>${data[id]}</span>`; 
                    el.classList.add('filled'); 
                } else { 
                    el.innerText = "-"; 
                    if (idx === newPhase && data.status === "ACTIVE") el.classList.add('active'); 
                }
            });

            const timerEl = document.getElementById('timer');
            if (newPhase < 10 && data.status === "ACTIVE") {
                const activeTeam = phaseOrder[newPhase].includes('A') ? "TEAM A" : "TEAM B";
                document.getElementById('turn-display').innerText = "TURNO: " + activeTeam;
                document.getElementById('turn-display').style.color = (activeTeam === "TEAM A") ? "var(--neon-blue)" : "var(--neon-red)";
                if (newPhase !== currentPhase) { currentPhase = newPhase; startTimer(); }
            } else if (newPhase >= 10) {
                clearInterval(timerInterval);
                document.getElementById('turn-display').innerText = "DRAFT COMPLETA";
                document.getElementById('turn-display').style.color = "var(--neon-gold)";
                timerEl.innerText = "FIGHT";
                timerEl.style.color = "var(--neon-gold)";
            }
        });

        function initUI() {
            document.querySelectorAll('.fearless-select').forEach(sel => {
                allChampions.sort().forEach(c => {
                    let opt = document.createElement('option');
                    opt.value = c; opt.innerText = c; sel.appendChild(opt);
                });
            });
            renderChamps();
        }

        function renderChamps(filter = "") {
            const grid = document.getElementById('champGrid');
            grid.innerHTML = "";
            allChampions.forEach(name => {
                if (name.toLowerCase().includes(filter.toLowerCase())) {
                    const btn = document.createElement('button');
                    btn.className = 'champ-btn';
                    btn.innerHTML = `<img src="${getIconUrl(name)}"><span>${name}</span>`;
                    btn.onclick = () => selectChamp(name);
                    grid.appendChild(btn);
                }
            });
        }

        function filterChamps() { renderChamps(document.getElementById('filterInput').value); }
        initUI();
    </script>
</body>
</html>
