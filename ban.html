<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>GN - ELITE DRAFT 1080p</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@600;700&display=swap');

        :root {
            --neon-blue: #00f2ff; --neon-red: #ff4655; --neon-gold: #c89b3c; --bg-dark: #02060a;
        }

        body {
            background: var(--bg-dark); color: white; font-family: 'Rajdhani', sans-serif;
            margin: 0; padding: 0;
            display: flex; flex-direction: column; align-items: center;
            height: 100vh; /* Blocca l'altezza alla finestra del browser */
            overflow: hidden; /* Impedisce lo scroll della pagina intera */
        }

        /* OVERLAY */
        #overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.98); z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            border: 4px solid var(--neon-gold); box-sizing: border-box;
        }

        .header {
            width: 100%; background: #000; border-bottom: 2px solid var(--neon-gold);
            padding: 10px 0; text-align: center; font-family: 'Orbitron';
        }
        .header h1 { margin: 0; font-size: 1.5rem; letter-spacing: 3px; }

        .status-bar { 
            display: flex; gap: 40px; align-items: center; 
            padding: 10px 0;
        }
        .timer { font-size: 2.5rem; font-family: 'Orbitron'; color: var(--neon-red); text-shadow: 0 0 15px var(--neon-red); min-width: 120px; text-align: center; }
        .turn-msg { font-family: 'Orbitron'; font-size: 1.1rem; color: var(--neon-gold); text-transform: uppercase; letter-spacing: 2px; }

        .main-container {
            display: grid; grid-template-columns: 220px 1fr 220px; gap: 15px; 
            width: 98%; max-width: 1800px;
            flex-grow: 1; /* Prende tutto lo spazio tra header e fearless */
            min-height: 0; /* Cruciale per permettere alla grid interna di scrollare */
        }

        /* BAN SLOTS RIDIMENSIONATI */
        .side-panel h3 { font-size: 0.9rem; margin: 5px 0; text-align: center; font-family: 'Orbitron'; }
        .ban-slot {
            background: rgba(255,255,255,0.03); border: 1px solid #222; 
            height: 50px; margin-bottom: 6px; 
            display: flex; align-items: center; justify-content: center;
            font-family: 'Orbitron'; font-size: 0.75rem; transition: 0.3s; overflow: hidden; gap: 8px;
        }
        .ban-slot img { width: 40px; height: 40px; object-fit: cover; border: 1px solid #444; }
        /* Slot attivo durante il turno: DORATO */
.ban-slot.active { 
    border-color: var(--neon-gold) !important; 
    box-shadow: 0 0 15px rgba(200, 155, 60, 0.4), inset 0 0 10px rgba(200, 155, 60, 0.2); 
    background: rgba(200, 155, 60, 0.1) !important;
    color: var(--neon-gold);
    animation: pulse-gold 1.5s infinite; /* Effetto pulsante opzionale */
}

@keyframes pulse-gold {
    0% { opacity: 1; }
    50% { opacity: 0.6; }
    100% { opacity: 1; }
}

/* Ban Team A - Cornice Blu quando confermato */
.side-panel:first-child .ban-slot.filled { 
    color: var(--neon-blue); 
    border: 1px solid var(--neon-blue); 
    background: rgba(0, 242, 255, 0.1); 
}

/* Ban Team B - Cornice Rossa quando confermato */
.side-panel:last-of-type .ban-slot.filled { 
    color: var(--neon-red); 
    border: 1px solid var(--neon-red); 
    background: rgba(255, 70, 85, 0.1); 
}
        /* Ban Team A - Cornice Blu quando pieno */
.side-panel:first-child .ban-slot.filled { 
    color: var(--neon-blue); 
    border: 1px solid var(--neon-blue); 
    background: rgba(0, 242, 255, 0.1); 
    box-shadow: inset 0 0 10px rgba(0, 242, 255, 0.2);
}

/* Ban Team B - Mantiene la cornice Rossa quando pieno */
.side-panel:last-of-type .ban-slot.filled { 
    color: var(--neon-red); 
    border: 1px solid var(--neon-red); 
    background: rgba(255, 70, 85, 0.1); 
    box-shadow: inset 0 0 10px rgba(255, 70, 85, 0.2);
}
        /* GRID CAMPIONI */
        .selection-area { display: flex; flex-direction: column; gap: 10px; height: 100%; min-height: 0; }
        .search-box {
            width: 100%; background: #000; border: 2px solid var(--neon-blue);
            color: white; padding: 10px; font-family: 'Orbitron'; font-size: 0.9rem; text-align: center; box-sizing: border-box;
        }

        .champ-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(85px, 1fr));
            gap: 8px; width: 100%; overflow-y: auto;
            padding: 10px; background: rgba(0,0,0,0.5); border: 1px solid #222;
            box-sizing: border-box; contain: content;
        }

        .champ-btn {
            background: #111; border: 1px solid #333; color: #ccc; 
            cursor: pointer; transition: transform 0.1s; padding: 4px;
            display: flex; flex-direction: column; align-items: center; gap: 3px;
        }
        .champ-btn img { width: 55px; height: 55px; border: 1px solid #444; }
        .champ-btn:hover { border-color: var(--neon-gold); transform: scale(1.05); }
        .champ-btn span { font-size: 0.55rem; font-weight: bold; text-align: center; white-space: nowrap; overflow: hidden; }
        
        .hidden { display: none !important; }

        /* FEARLESS COMPATTO */
        .fearless-container {
    width: 98%; 
    max-width: 1800px;
    margin: 10px 0; 
    padding: 10px;
    border-top: 1px dashed #333; 
    
    /* Cambiato da grid a flex per centrare */
    display: flex; 
    justify-content: center; /* Centra i box orizzontalmente */
    gap: 20px; /* Spazio tra i due box */
    
    background: rgba(0,0,0,0.3);
    position: relative; /* Necessario per il posizionamento del tasto reset */
}

.fearless-box { 
    background: rgba(255,255,255,0.02); 
    padding: 8px; 
    border: 1px solid #222;
    width: 350px; /* Imposta una larghezza fissa o massima per non farli allargare troppo */
}
        .fearless-box h4 { font-family: 'Orbitron'; color: var(--neon-gold); margin: 0 0 5px 0; font-size: 0.7rem; text-align: center; }
        .fearless-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
        .fearless-select {
            width: 100%; background: #000; color: var(--neon-blue); border: 1px solid #444;
            padding: 3px; font-family: 'Rajdhani'; font-size: 0.7rem;
        }

        .btn-reset {
            position: absolute; bottom: 5px; right: 10px;
            background: none; border: 1px solid #444;
            color: #444; padding: 5px 15px; cursor: pointer; font-family: 'Orbitron'; font-size: 0.6rem;
        }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: var(--neon-blue); border-radius: 10px; }
    </style>
</head>
<body>

    <div id="overlay">
        <h2 style="font-family:'Orbitron'; color:var(--neon-gold); letter-spacing:5px;">SISTEMA BLOCCATO</h2>
        <div style="color: #666; font-size: 0.9rem; margin-bottom: 25px; font-family: 'Orbitron';">Attendere gli altri giocatori...</div>
        <button id="startBtn" onclick="activateProtocol()" style="padding:15px 45px; background:none; border:2px solid var(--neon-blue); color:var(--neon-blue); font-family:'Orbitron'; cursor:pointer; box-shadow: 0 0 15px rgba(0, 242, 255, 0.3);">START BAN PHASE</button>
    </div>

    <div class="header"><h1>GALACTIC NEMESIS - ELITE DRAFT</h1></div>

    <div class="status-bar">
        <div id="turn-display" class="turn-msg">SYNC...</div>
        <div id="timer" class="timer">60</div>
    </div>

    <div class="main-container">
        <div class="side-panel">
            <h3 style="color: var(--neon-blue)">TEAM A BANS</h3>
            <div class="ban-slot" id="slotA1">-</div><div class="ban-slot" id="slotA2">-</div>
            <div class="ban-slot" id="slotA3">-</div><div class="ban-slot" id="slotA4">-</div>
            <div class="ban-slot" id="slotA5">-</div>
        </div>

        <div class="selection-area">
            <input type="text" id="filterInput" class="search-box" placeholder="CERCA CAMPIONE..." oninput="filterChamps()">
            <div class="champ-grid" id="champGrid"></div>
        </div>

        <div class="side-panel">
            <h3 style="color: var(--neon-red)">TEAM B BANS</h3>
            <div class="ban-slot" id="slotB1">-</div><div class="ban-slot" id="slotB2">-</div>
            <div class="ban-slot" id="slotB3">-</div><div class="ban-slot" id="slotB4">-</div>
            <div class="ban-slot" id="slotB5">-</div>
        </div>
    </div>

    <div class="fearless-container">
        <div class="fearless-box"><h4>G1 FEARLESS</h4><div class="fearless-grid"><select class="fearless-select" id="f1_1" onchange="syncFearless()"></select><select class="fearless-select" id="f1_2" onchange="syncFearless()"></select><select class="fearless-select" id="f1_3" onchange="syncFearless()"></select><select class="fearless-select" id="f1_4" onchange="syncFearless()"></select></div></div>
        <div class="fearless-box"><h4>G2 FEARLESS</h4><div class="fearless-grid"><select class="fearless-select" id="f2_1" onchange="syncFearless()"></select><select class="fearless-select" id="f2_2" onchange="syncFearless()"></select><select class="fearless-select" id="f2_3" onchange="syncFearless()"></select><select class="fearless-select" id="f2_4" onchange="syncFearless()"></select></div></div>
        <button class="btn-reset" onclick="resetBanPhase()">RESET</button>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDNRL0Rbo58WPjII0BzSRQZ1M7ZJ9MdsY4",
            authDomain: "galactic-nemesis-7bee5.firebaseapp.com",
            projectId: "galactic-nemesis-7bee5",
            storageBucket: "galactic-nemesis-7bee5.firebasestorage.app",
            messagingSenderId: "265814903052",
            appId: "1:265814903052:web:6c59477e9852e91387a129",
            databaseURL: "https://galactic-nemesis-7bee5-default-rtdb.europe-west1.firebasedatabase.app"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const banRef = db.ref('ban_phase_2vs2_final_v5');

        const allChampions = ["Aatrox", "Ahri", "Akali", "Akshan", "Alistar", "Ambessa", "Amumu", "Anivia", "Annie", "Aphelios", "Ashe", "Aurelion Sol", "Azir", "Bard", "Bel'Veth", "Blitzcrank", "Brand", "Braum", "Briar", "Caitlyn", "Camille", "Cassiopeia", "Cho'Gath", "Corki", "Darius", "Diana", "Dr. Mundo", "Draven", "Ekko", "Elise", "Evelynn", "Ezreal", "Fiddlesticks", "Fiora", "Fizz", "Galio", "Gangplank", "Garen", "Gnar", "Gragas", "Graves", "Gwen", "Hecarim", "Heimerdinger", "Hwei", "Illaoi", "Irelia", "Ivern", "Janna", "Jarvan IV", "Jax", "Jayce", "Jhin", "Jinx", "K'Sante", "Kai'Sa", "Kalista", "Karma", "Karthus", "Kassadin", "Katarina", "Kayle", "Kayn", "Kennen", "Kha'Zix", "Kindred", "Kled", "Kog'Maw", "LeBlanc", "Lee Sin", "Leona", "Lillia", "Lissandra", "Lucian", "Lulu", "Lux", "Malphite", "Malzahar", "Maokai", "Master Yi", "Milio", "Miss Fortune", "Mordekaiser", "Morgana", "Naafiri", "Nami", "Nasus", "Nautilus", "Neeko", "Nidalee", "Nilah", "Nocturne", "Nunu & Willump", "Olaf", "Orianna", "Ornn", "Pantheon", "Poppy", "Pyke", "Qiyana", "Quinn", "Rakan", "Rammus", "Rek'Sai", "Rell", "Renata Glasc", "Renekton", "Rengar", "Riven", "Rumble", "Ryze", "Samira", "Sejuani", "Senna", "Seraphine", "Sett", "Shaco", "Shen", "Shyvana", "Singed", "Sion", "Sivir", "Skarner", "Smolder", "Sona", "Soraka", "Swain", "Sylas", "Syndra", "Tahm Kench", "Taliyah", "Talon", "Taric", "Teemo", "Thresh", "Tristana", "Trundle", "Tryndamere", "Twisted Fate", "Twitch", "Udyr", "Urgot", "Varus", "Vayne", "Veigar", "Vel'Koz", "Vex", "Vi", "Viego", "Viktor", "Vladimir", "Volibear", "Warwick", "Wukong", "Xayah", "Xerath", "Xin Zhao", "Yasuo", "Yone", "Yorick", "Yuumi", "Zac", "Zed", "Zeri", "Ziggs", "Zilean", "Zoe", "Zyra"];

        let currentPhase = -1;
        let timerInterval;
        const phaseOrder = ['slotA1', 'slotB1', 'slotA2', 'slotB2', 'slotA3', 'slotB3', 'slotA4', 'slotB4', 'slotA5', 'slotB5'];

        function getIconUrl(name) {
            let img = name.replace(/\s+/g, '').replace("'", "").replace(".", "");
            const mapping = {"Wukong": "MonkeyKing", "LeBlanc": "Leblanc", "KhaZix": "Khazix", "ChoGath": "Chogath", "KaiSa": "Kaisa", "KSante": "Ksante", "BelVeth": "Belveth", "Nunu&Willump": "Nunu", "VelKoz": "Velkoz", "RenataGlasc": "Renata"};
            return `https://ddragon.leagueoflegends.com/cdn/14.22.1/img/champion/${mapping[img] || img}.png`;
        }

        function activateProtocol() { banRef.update({ status: "ACTIVE", currentPhase: 0 }); }

        function startTimer() {
            clearInterval(timerInterval);
            let time = 60;
            const timerEl = document.getElementById('timer');
            timerInterval = setInterval(() => {
                time--; timerEl.innerText = time;
                if (time <= 0) { clearInterval(timerInterval); timerEl.innerText = "UP"; }
            }, 1000);
        }

        function selectChamp(name) {
            banRef.once('value', (snap) => {
                const phase = snap.val().currentPhase || 0;
                if (phase >= 10) return;
                banRef.update({ [phaseOrder[phase]]: name, currentPhase: phase + 1 });
            });
        }

        function syncFearless() {
            const fearlessData = {};
            document.querySelectorAll('.fearless-select').forEach(sel => fearlessData[sel.id] = sel.value);
            banRef.update({ fearless: fearlessData });
        }

        function resetBanPhase() {
            if(confirm("Reset Protocol?")) {
                clearInterval(timerInterval);
                const resetObj = { status: "IDLE", currentPhase: 0 };
                phaseOrder.forEach(id => resetObj[id] = "");
                banRef.update(resetObj);
            }
        }

        banRef.on('value', (snap) => {
            const data = snap.val() || {};
            const newPhase = data.currentPhase || 0;
            document.getElementById('overlay').style.display = (data.status === "ACTIVE") ? "none" : "flex";

            if (data.fearless) {
                Object.keys(data.fearless).forEach(id => {
                    const sel = document.getElementById(id);
                    if(sel) sel.value = data.fearless[id];
                });
            }

            phaseOrder.forEach((id, idx) => {
    const el = document.getElementById(id);
    el.classList.remove('active', 'filled');
    
    if (data[id]) { 
        // Se il ban è presente, inserisce immagine e nome
        el.innerHTML = `<img src="${getIconUrl(data[id])}"> <span>${data[id]}</span>`; 
        el.classList.add('filled'); // Il CSS farà il resto in base alla posizione (A o B)
    } else { 
        el.innerText = "-"; 
        // Mostra il bordo lampeggiante solo se è il turno attivo
        if (idx === newPhase && data.status === "ACTIVE") {
            el.classList.add('active'); 
        }
    }
});

            if (newPhase < 10 && data.status === "ACTIVE") {
                const activeTeam = phaseOrder[newPhase].includes('A') ? "TEAM A" : "TEAM B";
                document.getElementById('turn-display').innerText = "TURNO: " + activeTeam;
                document.getElementById('turn-display').style.color = (activeTeam === "TEAM A") ? "var(--neon-blue)" : "var(--neon-red)";
                if (newPhase !== currentPhase) { currentPhase = newPhase; startTimer(); }
            } else if (newPhase >= 10) {
                clearInterval(timerInterval);
                document.getElementById('turn-display').innerText = "DRAFT COMPLETA";
                document.getElementById('timer').innerText = "FIGHT";
            }
        });

        function initUI() {
            const grid = document.getElementById('champGrid');
            allChampions.sort().forEach(name => {
                document.querySelectorAll('.fearless-select').forEach(sel => {
                    let opt = document.createElement('option');
                    opt.value = name; opt.innerText = name; sel.appendChild(opt);
                });
                const btn = document.createElement('button');
                btn.className = 'champ-btn';
                btn.id = `btn-${name.replace(/\s+/g, '').replace("'", "").replace(".", "")}`;
                btn.innerHTML = `<img src="${getIconUrl(name)}"><span>${name}</span>`;
                btn.onclick = () => selectChamp(name);
                grid.appendChild(btn);
            });
        }

        function filterChamps() {
            const val = document.getElementById('filterInput').value.toLowerCase();
            allChampions.forEach(name => {
                const btn = document.getElementById(`btn-${name.replace(/\s+/g, '').replace("'", "").replace(".", "")}`);
                if (name.toLowerCase().includes(val)) btn.classList.remove('hidden');
                else btn.classList.add('hidden');
            });
        }

        initUI();
    </script>
</body>
</html>
