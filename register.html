<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horizon 6 Tournament - Driver Registration</title>
    <link rel="icon" type="image/png" href="https://www.vhv.rs/dpng/d/500-5007265_forza-png-forza-forza-motorsport-logo-png-transparent.png">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,700;1,900&display=swap" rel="stylesheet">
    <style>
        :root {
            --horizon-pink: #ff0055;
            --horizon-orange: #ff5500;
            --asphalt-dark: #0e1017;
            /* Effetto vetro semitrasparente sincronizzato con il login */
            --carbon-grey: rgba(22, 25, 34, 0.82); 
            --neon-white: #f3f4f6;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }

        body {
            background-color: var(--asphalt-dark);
            color: var(--neon-white);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden; /* Blocca le barre di scorrimento create dal video */
            position: relative;
        }

        /* 🏎️ CONTENITORE VIDEO YOUTUBE LIVE */
      .video-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            pointer-events: none; /* Impedisce i click accidentali sul video */
            overflow: hidden;
        }

        /* Forza il video a mantenere i 16:9 coprendo tutto lo schermo (effetto Cover) */
        .video-background iframe {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100vw;
            height: 56.25vw;
            min-height: 100vh;
            min-width: 177.77vh;
            transform: translate(-50%, -50%);
        }

        /* 🕶️ OVERLAY SCURO CONTRASTO */
        .video-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(14, 16, 23, 0.45) 0%, rgba(14, 16, 23, 0.88) 100%);
            z-index: -1;
        }
        .registration-card {
            background: linear-gradient(135deg, var(--carbon-grey) 0%, rgba(11, 13, 19, 0.9) 100%);
            backdrop-filter: blur(12px); /* Sfocatura sullo sfondo in movimento */
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-left: 6px solid var(--horizon-pink); /* Mantenuto rosa per identificare la registrazione */
            border-radius: 12px;
            width: 100%;
            max-width: 440px;
            padding: 40px 35px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.6);
            z-index: 1;
        }

        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { font-weight: 900; font-size: 1.9rem; text-transform: uppercase; font-style: italic; }
        .header span { color: var(--horizon-orange); font-size: 0.75rem; font-weight: 700; letter-spacing: 5px; text-transform: uppercase; display: block; }

        .input-group { margin-bottom: 22px; }
        .input-group label { display: block; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; color: #83899a; margin-bottom: 8px; }
        .input-group input { width: 100%; padding: 13px 16px; background: rgba(0, 0, 0, 0.5); border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 6px; color: #fff; font-weight: 700; }
        .input-group input:focus { outline: none; border-color: var(--horizon-pink); box-shadow: 0 0 10px rgba(255, 0, 85, 0.25); }

        .btn-register {
            width: 100%; padding: 16px; background: linear-gradient(135deg, var(--horizon-pink) 0%, var(--horizon-orange) 100%);
            border: none; border-radius: 6px; color: white; font-weight: 900; text-transform: uppercase; font-style: italic; cursor: pointer; transition: all 0.2s;
        }
        .btn-register:hover { filter: brightness(1.1); transform: translateY(-2px); }

        /* Link per tornare indietro se si è già registrati */
        .login-link { text-align: center; margin-top: 20px; font-size: 0.8rem; color: #83899a; }
        .login-link a { color: var(--horizon-orange); text-decoration: none; font-weight: 700; }

        .message { margin-top: 20px; padding: 12px; border-radius: 6px; font-size: 0.8rem; font-weight: 700; text-align: center; display: none; }
        .message.error { background: rgba(255, 51, 51, 0.12); border: 1px solid #ff3355; color: #ff5577; display: block; }
        .message.success { background: rgba(0, 255, 136, 0.12); border: 1px solid #00ff88; color: #55ffaa; display: block; }
    </style>
</head>
<body>

    <!-- 🎥 SFONDO ANIMATO VIDEO FORZA HORIZON 6 -->
    <div class="video-background">
        <iframe src="https://www.youtube.com/embed/2GTeFh6dx8c?autoplay=1&mute=1&loop=1&playlist=2GTeFh6dx8c&controls=0&showinfo=0&rel=0&modestbranding=1&iv_load_policy=3&playsinline=1" 
                frameborder="0" 
                allow="autoplay; encrypted-media" 
                allowfullscreen>
         iframe>
    </div>
    
    <!-- 🕶️ FILTRO SCURO PER LEGGIBILITÀ TESTI -->
    <div class="video-overlay"></div>

    <!-- 🎴 SCHEDA DI REGISTRAZIONE INTERATTIVA -->
    <div class="registration-card">
        <div class="header">
            <h1>Horizon 6 Festival</h1>
            <span>Driver Enlistment</span>
        </div>

        <div class="input-group">
            <label>Display & Login ID</label>
            <input type="text" id="loginId" placeholder="Es. AlfaRomero" required>
        </div>

        <div class="input-group">
            <label>Xbox Gamertag</label>
            <input type="text" id="gamertag" placeholder="Es. RomeroXbox92" required>
        </div>

        <div class="input-group">
            <label>Password Key (Min. 6 caratteri)</label>
            <input type="password" id="password" placeholder="••••••••" required>
        </div>

        <button type="button" id="btnRegister" class="btn-register">REGISTRA PILOTA</button>

        <div class="login-link">
            Hai già un account? <a href="login.html">Accedi qui</a>
        </div>

        <div id="feedback" class="message"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-auth.js";
        import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-database.js";

        // CONFIGURAZIONE FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyDNRL0Rbo58WPjII0BzSRQZ1M7ZJ9MdsY4",
            authDomain: "galactic-nemesis-7bee5.firebaseapp.com",
            databaseURL: "https://galactic-nemesis-7bee5-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "galactic-nemesis-7bee5",
            storageBucket: "galactic-nemesis-7bee5.firebasestorage.app",
            messagingSenderId: "265814903052",
            appId: "1:265814903052:web:6c59477e9852e91387a129"
        };

        // Inizializzazione protetta
        let auth, database;
        try {
            const app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            database = getDatabase(app);
        } catch (e) {
            alert("Errore critico di configurazione Firebase: " + e.message);
        }

        // Ascolto del click diretto sul pulsante
        document.getElementById('btnRegister').addEventListener('click', async () => {
            const loginIdInput = document.getElementById('loginId');
            const gamertagInput = document.getElementById('gamertag');
            const passwordInput = document.getElementById('password');
            const feedback = document.getElementById('feedback');

            // Pulizia messaggi precedenti
            feedback.style.display = "none";
            feedback.className = "message";

            if (!loginIdInput || !gamertagInput || !passwordInput) {
                alert("Errore interno: Uno o più campi di testo non sono stati trovati nella pagina HTML.");
                return;
            }

            const loginId = loginIdInput.value.trim();
            const gamertag = gamertagInput.value.trim();
            const password = passwordInput.value;

            // Validazione visiva immediata
            if (!loginId || !gamertag || !password) {
                feedback.innerText = "ATTENZIONE: Compila tutti i campi prima di partire!";
                feedback.className = "message error";
                feedback.style.display = "block";
                return;
            }

            if (password.length < 6) {
                feedback.innerText = "ATTENZIONE: La password deve avere almeno 6 caratteri.";
                feedback.className = "message error";
                feedback.style.display = "block";
                return;
            }

            // Generazione email virtuale
            const cleanId = loginId.replace(/\s+/g, '').toLowerCase();
            const virtualEmail = `${cleanId}@horizon6.festival`;

            // Mostra un feedback di caricamento temporaneo
            feedback.innerText = "Registrazione in corso... Accensione motori...";
            feedback.className = "message success";
            feedback.style.display = "block";

            try {
                // 1. Autenticazione su Firebase
                const userCredential = await createUserWithEmailAndPassword(auth, virtualEmail, password);
                const user = userCredential.user;

                // 2. Struttura dati 6 Gare
                const newDriverData = {
                    loginId: loginId,
                    gamertag: gamertag,
                    g1_pos: "-", g2_pos: "-", g3_pos: "-",
                    g4_pos: "-", g5_pos: "-", g6_pos: "-"
                };

                // 3. Scrittura nel database reale
                await set(ref(database, 'horizon_championship/drivers/' + user.uid), newDriverData);

                // Successo totale con Reindirizzamento Automatico
                feedback.innerText = "PILOTA REGISTRATO CON SUCCESSO! Trasferimento al Gate di Login...";
                feedback.className = "message success";
                feedback.style.display = "block";
                
                // Reset dei campi
                loginIdInput.value = "";
                gamertagInput.value = "";
                passwordInput.value = "";

                // Attendi 2.5 secondi e sposta alla pagina di login
                setTimeout(() => {
                    window.location.href = "login.html";
                }, 2500);

            } catch (error) {
                feedback.className = "message error";
                feedback.style.display = "block";
                console.error("Errore dettagliato riscontrato:", error);
                
                if (error.code === 'auth/email-already-in-use') {
                    feedback.innerText = "ERRORE: Questo Login ID è già registrato nel Festival.";
                } else {
                    feedback.innerText = "ERRORE SERVER: " + error.message;
                }
            }
        });
    </script>
</body>
</html>
