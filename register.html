<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horizon 6 Tournament - Driver Registration</title>
    <!-- Font stile racing e moderno -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,700;1,900&display=swap" rel="stylesheet">
    <style>
        :root {
            --horizon-pink: #ff0055;
            --horizon-orange: #ff5500;
            --asphalt-dark: #12141c;
            --carbon-grey: #1a1d29;
            --neon-white: #f3f4f6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background-color: var(--asphalt-dark);
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(255, 0, 85, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(255, 85, 0, 0.15) 0%, transparent 40%);
            color: var(--neon-white);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            padding: 20px;
        }

        /* Contenitore Principale stile "Paddock Pass" */
        .registration-card {
            background: linear-gradient(135deg, var(--carbon-grey) 0%, #11131a 100%);
            border: 2px solid rgba(255, 255, 255, 0.05);
            border-left: 6px solid var(--horizon-pink);
            border-top-right-radius: 20px;
            border-bottom-left-radius: 20px;
            width: 100%;
            max-width: 480px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1);
            position: relative;
        }

        /* Dettaglio estetico Tachimetro / Linee di corsa */
        .registration-card::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 100px;
            height: 4px;
            background: linear-gradient(90deg, var(--horizon-pink), var(--horizon-orange));
            border-top-right-radius: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 35px;
        }

        .header h1 {
            font-weight: 900;
            font-size: 1.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-style: italic;
            background: linear-gradient(45deg, #fff 50%, #aaa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header span {
            color: var(--horizon-orange);
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 4px;
            text-transform: uppercase;
            display: block;
            margin-top: 5px;
        }

        /* Gruppi di Input */
        .input-group {
            position: relative;
            margin-bottom: 25px;
        }

        .input-group label {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #8a8f9d;
            margin-bottom: 8px;
        }

        .input-group input, .input-group select {
            width: 100%;
            padding: 12px 16px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            color: #fff;
            font-size: 0.95rem;
            font-weight: 700;
            transition: all 0.3s ease;
        }

        /* Effetto Focus stile fari LED */
        .input-group input:focus, .input-group select:focus {
            outline: none;
            border-color: var(--horizon-pink);
            box-shadow: 0 0 12px rgba(255, 0, 85, 0.3);
            background: rgba(0, 0, 0, 0.5);
        }

        /* Pulsante di Submit Nitro Boost */
        .btn-register {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, var(--horizon-pink) 0%, var(--horizon-orange) 100%);
            border: none;
            border-radius: 6px;
            color: white;
            font-weight: 900;
            font-size: 1rem;
            text-transform: uppercase;
            font-style: italic;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(255, 0, 85, 0.4);
            margin-top: 10px;
        }

        .btn-register:hover {
            transform: translateY(-2px) scale(1.01);
            box-shadow: 0 8px 25px rgba(255, 85, 0, 0.6);
            filter: brightness(1.1);
        }

        .btn-register:active {
            transform: translateY(1px);
        }

        /* Messaggi di Feedback dello Schermo/Terminal */
        .message {
            margin-top: 20px;
            padding: 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 700;
            text-align: center;
            display: none;
        }

        .message.error {
            background: rgba(255, 0, 0, 0.15);
            border: 1px solid #ff3333;
            color: #ff6666;
            display: block;
        }

        .message.success {
            background: rgba(0, 255, 100, 0.15);
            border: 1px solid #00cc66;
            color: #66ff99;
            display: block;
        }
    </style>
</head>
<body>

    <div class="registration-card">
        <div class="header">
            <h1>Horizon 6 Festival</h1>
            <span>Driver Enlistment</span>
        </div>

        <form id="registrationForm">
            <!-- Email (Richiesta da Firebase Auth) -->
            <div class="input-group">
                <label for="email">Indirizzo Email</label>
                <input type="email" id="email" placeholder="pilota@esempio.com" required>
            </div>

            <!-- Gamertag / Nome Utente -->
            <div class="input-group">
                <label for="gamertag">Gamertag Xbox / Nome Utente</label>
                <input type="text" id="gamertag" placeholder="Es. ForzaRacer99" required>
            </div>

            <!-- Password -->
            <div class="input-group">
                <label for="password">Password Key (Min. 6 caratteri)</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <!-- Dispositivo/Piattaforma -->
            <div class="input-group">
                <label for="platform">Piattaforma Hardware</label>
                <select id="platform" required>
                    <option value="" disabled selected>Seleziona la tua piattaforma</option>
                    <option value="PC">PC (Steam / MS Store)</option>
                    <option value="Xbox Series X">Xbox Series X</option>
                    <option value="Xbox Series S">Xbox Series S</option>
                </select>
            </div>

            <button type="submit" class="btn-register">ACCENDI I MOTORI (ISCRIVITI)</button>
        </form>

        <div id="feedback" class="message"></div>
    </div>

    <!-- Moduli SDK Firebase (Versione v9+ Compatta) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-auth.js";
        import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-database.js";

        // CONFIGURE QUI IL TUO PROGETTO FIREBASE
        const firebaseConfig = {
            apiKey: "LA_TUA_API_KEY",
            authDomain: "IL_TUO_AUTH_DOMAIN",
            databaseURL: "IL_TUO_DATABASE_URL",
            projectId: "IL_TUO_PROJECT_ID",
            storageBucket: "IL_TUO_STORAGE_BUCKET",
            messagingSenderId: "IL_TUO_MESSAGING_SENDER_ID",
            appId: "IL_TUO_APP_ID"
        };

        // Inizializzazione di Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const database = getDatabase(app);

        // Gestione Invio Form
        document.getElementById('registrationForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const gamertag = document.getElementById('gamertag').value;
            const platform = document.getElementById('platform').value;
            const feedback = document.getElementById('feedback');

            // Reset dello stato del messaggio
            feedback.className = "message";
            feedback.style.display = "none";

            try {
                // 1. Creazione dell'account in Firebase Authentication
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                // 2. Salvataggio delle informazioni aggiuntive nel Realtime Database
                // Strutturiamo i piloti dentro il nodo 'horizon_tournament/drivers'
                await set(ref(database, 'horizon_tournament/drivers/' + user.uid), {
                    gamertag: gamertag,
                    email: email,
                    platform: platform,
                    registrationDate: new Date().toISOString(),
                    assignedMatch: "PENDING" // Verrà usato dall'algoritmo di accoppiamento automatizzato
                });

                // Successo
                feedback.innerText = "REGISTRAZIONE COMPLETATA! Benvenuto al Festival, " + gamertag;
                feedback.className = "message success";
                document.getElementById('registrationForm').reset();

            } catch (error) {
                // Gestione errori (es. Email già in uso o password troppo debole)
                feedback.className = "message error";
                if(error.code === 'auth/email-already-in-use') {
                    feedback.innerText = "ERRORE: Questo indirizzo email è già registrato sulla griglia.";
                } else if(error.code === 'auth/weak-password') {
                    feedback.innerText = "ERRORE: La password deve avere almeno 6 caratteri.";
                } else {
                    feedback.innerText = "ERRORE CRITICO: " + error.message;
                }
            }
        });
    </script>
</body>
</html>
