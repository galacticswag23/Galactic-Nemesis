<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horizon 6 Tournament - Driver Login</title>
    <link rel="icon" type="image/png" href="https://www.vhv.rs/dpng/d/500-5007265_forza-png-forza-forza-motorsport-logo-png-transparent.png">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,700;1,900&display=swap" rel="stylesheet">
    <style>
        :root {
            --horizon-pink: #ff0055;
            --horizon-orange: #ff5500;
            --asphalt-dark: #0e1017;
            /* Modificato leggermente in rgba per far intravedere il video dietro con effetto vetro */
            --carbon-grey: rgba(22, 25, 34, 0.82); 
            --neon-white: #f3f4f6;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }

        body {
            background-color: var(--asphalt-dark);
            color: var(--neon-white);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden; /* Blocca le barre di scorrimento create dal video */
            position: relative;
        }

        /* 🏎️ CONTENITORE VIDEO YOUTUBE LIVE */
        .video-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            pointer-events: none; /* Impedisce i click accidentali sul video */
            overflow: hidden;
        }

        /* Forza il video a mantenere i 16:9 coprendo tutto lo schermo (effetto Cover) */
        .video-background iframe {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100vw;
            height: 56.25vw;
            min-height: 100vh;
            min-width: 177.77vh;
            transform: translate(-50%, -50%);
        }

        /* 🕶️ OVERLAY SCURO CONTRASTO */
        .video-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(14, 16, 23, 0.45) 0%, rgba(14, 16, 23, 0.88) 100%);
            z-index: -1;
        }

        .login-card {
            background: linear-gradient(135deg, var(--carbon-grey) 0%, rgba(11, 13, 19, 0.9) 100%);
            backdrop-filter: blur(12px); /* Effetto sfocatura sullo sfondo in movimento */
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-left: 6px solid var(--horizon-orange);
            border-radius: 12px;
            width: 100%;
            max-width: 440px;
            padding: 40px 35px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.6);
            z-index: 1;
        }

        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { font-weight: 900; font-size: 1.9rem; text-transform: uppercase; font-style: italic; }
        .header span { color: var(--horizon-pink); font-size: 0.75rem; font-weight: 700; letter-spacing: 5px; text-transform: uppercase; display: block; }

        .input-group { margin-bottom: 22px; }
        .input-group label { display: block; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; color: #83899a; margin-bottom: 8px; }
        .input-group input { width: 100%; padding: 13px 16px; background: rgba(0, 0, 0, 0.5); border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 6px; color: #fff; font-weight: 700; }
        .input-group input:focus { outline: none; border-color: var(--horizon-orange); box-shadow: 0 0 10px rgba(255, 85, 0, 0.25); }

        .btn-login {
            width: 100%; padding: 16px; background: linear-gradient(135deg, var(--horizon-orange) 0%, var(--horizon-pink) 100%);
            border: none; border-radius: 6px; color: white; font-weight: 900; text-transform: uppercase; font-style: italic; cursor: pointer; transition: all 0.2s;
        }
        .btn-login:hover { filter: brightness(1.1); transform: translateY(-2px); }

        .register-link { text-align: center; margin-top: 20px; font-size: 0.8rem; color: #83899a; }
        .register-link a { color: var(--horizon-pink); text-decoration: none; font-weight: 700; }

        .message { margin-top: 20px; padding: 12px; border-radius: 6px; font-size: 0.8rem; font-weight: 700; text-align: center; display: none; }
        .message.error { background: rgba(255, 51, 51, 0.12); border: 1px solid #ff3355; color: #ff5577; display: block; }
    </style>
</head>
<body>

    <!-- 🎥 SFONDO ANIMATO VIDEO FORZA HORIZON 6 -->
    <div class="video-background">
        <iframe src="https://www.youtube.com/embed/2GTeFh6dx8c?autoplay=1&mute=1&loop=1&playlist=2GTeFh6dx8c&controls=0&showinfo=0&rel=0&modestbranding=1&iv_load_policy=3&playsinline=1" 
                frameborder="0" 
                allow="autoplay; encrypted-media" 
                allowfullscreen>
        </iframe>
    </div>
    
    <!-- 🕶️ FILTRO SCURO PER LEGGEBILITÀ TESTI -->
    <div class="video-overlay"></div>

    <!-- 🎴 SCHEDA DI LOGIN INTERATTIVA -->
    <div class="login-card">
        <div class="header">
            <h1>Festival Gate</h1>
            <span>Driver Authentication</span>
        </div>

        <form id="loginForm">
            <div class="input-group">
                <label for="loginId">Display & Login ID</label>
                <input type="text" id="loginId" placeholder="Il tuo Login ID" required>
            </div>

            <div class="input-group">
                <label for="password">Password Key</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-login">ACCEDI ALLA CLASSIFICA</button>
        </form>

        <div class="register-link">
            Non sei ancora in griglia? <a href="register.html">Iscriviti ora</a>
        </div>

        <div id="feedback" class="message"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-auth.js";

        // CONFIGURAZIONE FIREBASE
        const firebaseConfig = {
              apiKey: "AIzaSyDNRL0Rbo58WPjII0BzSRQZ1M7ZJ9MdsY4",
              authDomain: "galactic-nemesis-7bee5.firebaseapp.com",
              databaseURL: "https://galactic-nemesis-7bee5-default-rtdb.europe-west1.firebasedatabase.app",
              projectId: "galactic-nemesis-7bee5",
              storageBucket: "galactic-nemesis-7bee5.firebasestorage.app",
              messagingSenderId: "265814903052",
              appId: "1:265814903052:web:6c59477e9852e91387a129"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const loginId = document.getElementById('loginId').value.trim();
            const password = document.getElementById('password').value;
            const feedback = document.getElementById('feedback');

            feedback.style.display = "none";

            // Rigeneriamo la mail fittizia usata in fase di registrazione
            const cleanId = loginId.replace(/\s+/g, '').toLowerCase();
            const virtualEmail = `${cleanId}@horizon6.festival`;

            try {
                // Eseguiamo il login
                await signInWithEmailAndPassword(auth, virtualEmail, password);
                
                // Login riuscito -> Reindirizza alla classifica
                window.location.href = "championship.html";

            } catch (error) {
                feedback.className = "message error";
                feedback.style.display = "block";
                if (error.code === 'auth/wrong-password' || error.code === 'auth/user-not-found') {
                    feedback.innerText = "ACCESSO NEGATO: Login ID o Password errati.";
                } else {
                    feedback.innerText = "ERRORE DI AUTENTICAZIONE: " + error.message;
                }
            }
        });
    </script>
</body>
</html>
