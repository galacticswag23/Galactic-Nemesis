<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horizon 6 - Championship Standings</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght=0,300;0,700;1,900&display=swap" rel="stylesheet">
    <style>
        :root {
            --horizon-pink: #ff0055;
            --horizon-orange: #ff5500;
            --asphalt-dark: #0a0c10;
            --carbon-card: #141822;
            --neon-blue: #00f0ff;
            --neon-white: #f3f4f6;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }

        body {
            background-color: var(--asphalt-dark);
            background-image: radial-gradient(circle at 50% 0%, rgba(255, 0, 85, 0.15) 0%, transparent 60%);
            color: var(--neon-white);
            padding: 40px 20px;
            min-height: 100vh;
        }

        .container { max-width: 900px; margin: 0 auto; }

        .header { text-align: center; margin-bottom: 40px; }
        .header h1 {
            font-weight: 900; font-size: 2.8rem; text-transform: uppercase; font-style: italic; letter-spacing: 2px;
            background: linear-gradient(45deg, #fff 30%, var(--horizon-pink) 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .header span { color: var(--horizon-orange); font-weight: 700; letter-spacing: 6px; text-transform: uppercase; font-size: 0.9rem; }

        /* Griglia delle Categorie */
        .categories-info {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 30px; text-align: center;
        }
        .cat-badge {
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); padding: 12px; border-radius: 6px; font-size: 0.8rem; font-weight: 700; text-transform: uppercase;
        }
        .cat-badge.g1 { border-bottom: 3px solid var(--neon-blue); }
        .cat-badge.g2 { border-bottom: 3px solid var(--horizon-orange); }
        .cat-badge.g3 { border-bottom: 3px solid var(--horizon-pink); }

        /* Tabella Classifica */
        .leaderboard-card {
            background: var(--carbon-card); border-radius: 12px; padding: 25px; box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.05); margin-bottom: 40px;
        }
        
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { text-transform: uppercase; font-size: 0.75rem; color: #727888; padding: 12px; letter-spacing: 1px; }
        td { padding: 16px 12px; border-bottom: 1px solid rgba(255,255,255,0.05); font-weight: 700; font-size: 0.95rem; }
        
        tr:first-child td { color: #fff; font-size: 1.1rem; }
        .pos-num { font-style: italic; font-weight: 900; color: var(--horizon-orange); width: 50px; }
        tr:nth-child(1) .pos-num { color: #ffd700; font-size: 1.4rem; } /* Oro al 1° */
        tr:nth-child(2) .pos-num { color: #c0c0c0; } /* Argento */
        tr:nth-child(3) .pos-num { color: #cd7f32; } /* Bronzo */

        .points-total { color: var(--neon-blue); font-weight: 900; text-align: right; }

        /* Pannello Direzione Gara (Admin) */
        .admin-panel {
            background: #11141c; border: 2px dashed rgba(255, 85, 0, 0.3); border-radius: 12px; padding: 30px;
        }
        .admin-panel h2 { font-style: italic; text-transform: uppercase; font-size: 1.2rem; margin-bottom: 20px; color: var(--horizon-orange); }
        
        .admin-row {
            display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 15px; margin-bottom: 15px; align-items: center;
            background: rgba(0,0,0,0.2); padding: 10px 15px; border-radius: 6px;
        }
        .admin-row span { font-weight: 700; font-size: 0.9rem; }
        .admin-row input {
            background: #000; border: 1px solid rgba(255,255,255,0.1); border-radius: 4px; padding: 8px; color: #fff; font-weight: 700; text-align: center;
        }
        .admin-row input:focus { border-color: var(--horizon-pink); outline: none; }

        .btn-save {
            width: 100%; padding: 15px; background: linear-gradient(135deg, var(--horizon-pink) 0%, var(--horizon-orange) 100%);
            border: none; border-radius: 6px; color: white; font-weight: 900; text-transform: uppercase; font-style: italic; cursor: pointer; letter-spacing: 1px; transition: all 0.2s;
        }
        .btn-save:hover { filter: brightness(1.2); transform: translateY(-1px); }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>Horizon Championship</h1>
            <span>Classifica Generale Piloti</span>
        </div>

        <div class="categories-info">
            <div class="cat-badge g1">Stage 1<br><span style="color:#fff">Asfalto (Road)</span></div>
            <div class="cat-badge g2">Stage 2<br><span style="color:#fff">Sterrato (Dirt)</span></div>
            <div class="cat-badge g3">Stage 3<br><span style="color:#fff">Cross-Country</span></div>
        </div>

        <!-- Tabella Live della Competizione -->
        <div class="leaderboard-card">
            <table>
                <thead>
                    <tr>
                        <th>Pos</th>
                        <th>Pilota (Gamertag)</th>
                        <th style="text-align: center;">G1</th>
                        <th style="text-align: center;">G2</th>
                        <th style="text-align: center;">G3</th>
                        <th style="text-align: right;">Punti Totali</th>
                    </tr>
                </thead>
                <tbody id="leaderboardBody">
                    <!-- Popolato in automatico da Firebase -->
                </tbody>
            </table>
        </div>

        <!-- Pannello di Gestione Risultati (Admin) -->
        <div class="admin-panel">
            <h2>Direzione Gara: Assegna Posizioni d'Arrivo</h2>
            <div id="adminDriversContainer">
                <!-- Elenco piloti per inserimento rapido posizioni -->
            </div>
            <button id="btnUpdateScores" class="btn-save">Aggiorna Griglia e Ricalcola Punti</button>
        </div>
    </div>

    <!-- Firebase SDK Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
        import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "LA_TUA_API_KEY",
            authDomain: "IL_TUO_AUTH_DOMAIN",
            databaseURL: "IL_TUO_DATABASE_URL",
            projectId: "IL_TUO_PROJECT_ID",
            storageBucket: "IL_TUO_STORAGE_BUCKET",
            messagingSenderId: "IL_TUO_MESSAGING_SENDER_ID",
            appId: "IL_TUO_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);

        // Tabella dei Punti del Campionato
        const pointsTable = { "1": 25, "2": 18, "3": 15, "4": 12, "5": 10, "6": 8, "7": 6, "8": 4, "9": 2, "10": 1 };
        
        function calculatePoints(pos) {
            return pointsTable[pos] || 0;
        }

        let driversData = {};

        // NOTA IMPORTANTE: Per far sì che la vecchia pagina di iscrizione scriva qui, 
        // assicurati che nel codice del form precedente l'indirizzo del database sia impostato su 'horizon_championship/drivers/' + user.uid
        onValue(ref(database, 'horizon_championship/drivers'), (snapshot) => {
            driversData = snapshot.val() || {};
            
            let driversArray = [];
            Object.keys(driversData).forEach(id => {
                let d = driversData[id];
                // Calcola il totale punti all'istante
                let total = calculatePoints(d.g1_pos) + calculatePoints(d.g2_pos) + calculatePoints(d.g3_pos);
                driversArray.push({
                    id: id,
                    loginId: d.loginId,
                    gamertag: d.gamertag,
                    g1: d.g1_pos || "-",
                    g2: d.g2_pos || "-",
                    g3: d.g3_pos || "-",
                    points: total
                });
            });

            // Ordina la classifica: prima per punti totali, poi in ordine alfabetico
            driversArray.sort((a, b) => b.points - a.points);

            // 1. Renderizza la classifica pubblica
            const tableBody = document.getElementById('leaderboardBody');
            tableBody.innerHTML = '';
            
            driversArray.forEach((driver, index) => {
                let tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="pos-num">#${index + 1}</td>
                    <td>${driver.loginId} <span style="font-size:0.75rem; color:#6b7180; block; font-weight:300;">(${driver.gamertag})</span></td>
                    <td style="text-align: center; color: var(--neon-blue);">${driver.g1}</td>
                    <td style="text-align: center; color: var(--horizon-orange);">${driver.g2}</td>
                    <td style="text-align: center; color: var(--horizon-pink);">${driver.g3}</td>
                    <td class="points-total">${driver.points} PTS</td>
                `;
                tableBody.appendChild(tr);
            });

            // 2. Renderizza il pannello amministratore per l'input posizioni
            const adminContainer = document.getElementById('adminDriversContainer');
            adminContainer.innerHTML = '';

            driversArray.forEach(driver => {
                let row = document.createElement('div');
                row.className = 'admin-row';
                row.innerHTML = `
                    <span>${driver.loginId}</span>
                    <input type="text" id="g1_${driver.id}" placeholder="Pos. G1" value="${driver.g1 === '-' ? '' : driver.g1}">
                    <input type="text" id="g2_${driver.id}" placeholder="Pos. G2" value="${driver.g2 === '-' ? '' : driver.g2}">
                    <input type="text" id="g3_${driver.id}" placeholder="Pos. G3" value="${driver.g3 === '-' ? '' : driver.g3}">
                `;
                adminContainer.appendChild(row);
            });
        });

        // Aggiorna i dati sul Database al click del pulsante
        document.getElementById('updateScores').addEventListener('click', async () => {
            try {
                for (let id in driversData) {
                    let g1Val = document.getElementById(`g1_${id}`).value.trim() || "-";
                    let g2Val = document.getElementById(`g2_${id}`).value.trim() || "-";
                    let g3Val = document.getElementById(`g3_${id}`).value.trim() || "-";

                    // Aggiorna la singola scheda del pilota mantenendo intatti i dati di iscrizione
                    driversData[id].g1_pos = g1Val;
                    driversData[id].g2_pos = g2Val;
                    driversData[id].g3_pos = g3Val;

                    await set(ref(database, `horizon_championship/drivers/${id}`), driversData[id]);
                }
                alert("Punteggi aggiornati con successo! Classifica ricalcolata.");
            } catch (error) {
                alert("Errore nel salvataggio: " + error.message);
            }
        });
    </script>
</body>
</html>
