<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horizon 6 - Season Standings</title>
    <link rel="icon" type="image/png" href="https://www.vhv.rs/dpng/d/500-5007265_forza-png-forza-forza-motorsport-logo-png-transparent.png">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,700;1,900&display=swap" rel="stylesheet">
    <style>
        :root {
            --horizon-pink: #ff0055;
            --horizon-orange: #ff5500;
            --asphalt-dark: #0a0c10;
            --carbon-card: #141822;
            --neon-blue: #00f0ff;
            --neon-white: #f3f4f6;
            
            /* Colori del Podio */
            --gold-neon: #ffd700;
            --silver-satin: #e0e0e0;
            --bronze-burnished: #cd7f32;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }

        #adminDriversContainer {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            margin-bottom: 20px;
        }

        .admin-row {
            display: grid;
            grid-template-columns: 2fr repeat(6, 65px);
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.03);
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .admin-row span {
            font-weight: 700;
            font-size: 0.9rem;
            color: var(--neon-white);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .admin-row select {
            width: 100%;
            padding: 8px 2px;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 4px;
            color: #fff;
            font-weight: 700;
            text-align: center;
            font-size: 0.85rem;
            transition: border-color 0.2s;
            cursor: pointer;
        }

        .admin-row select:focus {
            outline: none;
            border-color: var(--horizon-pink);
            background: rgba(255, 0, 85, 0.1);
        }

        body {
            background-color: var(--asphalt-dark);
            background-image: radial-gradient(circle at 50% 0%, rgba(255, 0, 85, 0.15) 0%, transparent 60%);
            color: var(--neon-white);
            padding: 40px 20px;
            min-height: 100vh;
        }

        .container { max-width: 1100px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 40px; }
        .header h1 {
            font-weight: 900; font-size: 2.8rem; text-transform: uppercase; font-style: italic; letter-spacing: 2px;
            background: linear-gradient(45deg, #fff 30%, var(--horizon-pink) 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .header span { color: var(--horizon-orange); font-weight: 700; letter-spacing: 6px; text-transform: uppercase; font-size: 0.9rem; }

        .categories-info {
            display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; margin-bottom: 30px; text-align: center;
        }
        .cat-badge {
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); padding: 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase;
        }
        .cat-badge.and { border-top: 3px solid var(--neon-blue); }
        .cat-badge.rit { border-top: 3px solid var(--horizon-pink); }
        .cat-badge span { color: #888; font-size: 0.65rem; display: block; margin-top: 3px;}

        .leaderboard-card {
            background: var(--carbon-card); border-radius: 12px; padding: 25px; box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.05); margin-bottom: 40px; overflow-x: auto;
        }
        
        table { width: 100%; border-collapse: collapse; text-align: left; min-width: 700px; }
        th { text-transform: uppercase; font-size: 0.7rem; color: #727888; padding: 12px; letter-spacing: 1px; }
        
        tbody { display: table-row-group; }
        tr { 
            position: relative;
            background: transparent;
            transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }
        td { padding: 16px 12px; border-bottom: 1px solid rgba(255,255,255,0.05); font-weight: 700; font-size: 0.9rem; transition: all 0.5s ease; }
        
        .pos-num { font-style: italic; font-weight: 900; color: #727888; width: 40px; }
        
        .badge-podio {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: 900;
            font-style: italic;
            text-transform: uppercase;
            font-size: 0.85rem;
            text-align: center;
            min-width: 45px;
            transition: all 0.5s ease;
        }

        tr.oro .badge-podio { 
            background: linear-gradient(135deg, #1a1500 0%, #ffd700 100%);
            color: #000;
            box-shadow: 0 0 12px rgba(255, 215, 0, 0.4);
            border: 1px solid var(--gold-neon);
            animation: pulse-gold 2s infinite alternate;
        }
        tr.oro td { color: #fff; }

        tr.argento .badge-podio { 
            background: linear-gradient(135deg, #222 0%, #c0c0c0 100%);
            color: #000;
            border: 1px solid var(--silver-satin);
            box-shadow: 0 0 8px rgba(224, 224, 224, 0.2);
        }

        tr.bronzo .badge-podio { 
            background: linear-gradient(135deg, #1a0b00 0%, #cd7f32 100%);
            color: #fff;
            border: 1px solid var(--bronze-burnished);
        }

        @keyframes pulse-gold {
            0% { box-shadow: 0 0 8px rgba(255, 215, 0, 0.3); transform: scale(1); }
            100% { box-shadow: 0 0 16px rgba(255, 215, 0, 0.6); transform: scale(1.03); }
        }

        .points-total { color: var(--neon-blue); font-weight: 900; text-align: right; font-size: 1.1rem; }
        tr.oro .points-total { color: var(--gold-neon); text-shadow: 0 0 8px rgba(255, 215, 0, 0.3); }

        .admin-panel {
            background: #11141c; border: 2px dashed rgba(255, 85, 0, 0.3); border-radius: 12px; padding: 30px;
        }
        .admin-panel h2 { font-style: italic; text-transform: uppercase; font-size: 1.2rem; margin-bottom: 20px; color: var(--horizon-orange); }
        
        .btn-save {
            width: 100%; padding: 15px; background: linear-gradient(135deg, var(--horizon-pink) 0%, var(--horizon-orange) 100%);
            border: none; border-radius: 6px; color: white; font-weight: 900; text-transform: uppercase; font-style: italic; cursor: pointer; letter-spacing: 1px; transition: all 0.2s;
        }
        .btn-save:hover { filter: brightness(1.2); transform: translateY(-1px); }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>Horizon Apex Season</h1>
            <span>Campionato Andata & Ritorno</span>
        </div>

        <div class="categories-info">
            <div class="cat-badge and">G1 <span>Asfalto (A)</span></div>
            <div class="cat-badge and">G2 <span>Sterrato (A)</span></div>
            <div class="cat-badge and">G3 <span>Cross (A)</span></div>
            <div class="cat-badge rit">G4 <span>Asfalto (R)</span></div>
            <div class="cat-badge rit">G5 <span>Sterrato (R)</span></div>
            <div class="cat-badge rit">G6 <span>Cross (R)</span></div>
        </div>

        <div class="leaderboard-card">
            <table>
                <thead>
                    <tr>
                        <th>Pos</th>
                        <th>Pilota (Gamertag)</th>
                        <th style="text-align: center; color: var(--neon-blue);">G1</th>
                        <th style="text-align: center; color: var(--neon-blue);">G2</th>
                        <th style="text-align: center; color: var(--neon-blue);">G3</th>
                        <th style="text-align: center; color: var(--horizon-pink);">G4</th>
                        <th style="text-align: center; color: var(--horizon-pink);">G5</th>
                        <th style="text-align: center; color: var(--horizon-pink);">G6</th>
                        <th style="text-align: right;">Punti Live</th>
                    </tr>
                </thead>
                <tbody id="leaderboardBody"></tbody>
            </table>
        </div>

        <div id="adminSection" class="admin-panel" style="display: none;">
            <h2>Direzione Gara: Inserimento Piazzamenti (Andata e Ritorno)</h2>
            <div style="display: grid; grid-template-columns: 2fr repeat(6, 65px); gap: 10px; padding: 0 15px 10px 15px; font-size: 0.7rem; font-weight: 700; color: #6b7180; text-transform: uppercase;">
                <div>Pilota</div><div>G1 (A)</div><div>G2 (A)</div><div>G3 (A)</div><div>G4 (R)</div><div>G5 (R)</div><div>G6 (R)</div>
            </div>
            <div id="adminDriversContainer"></div>
            <button id="btnUpdateScores" class="btn-save">Salva Posizioni e Ricalcola Campionato</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-auth.js";
        import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDNRL0Rbo58WPjII0BzSRQZ1M7ZJ9MdsY4",
            authDomain: "galactic-nemesis-7bee5.firebaseapp.com",
            databaseURL: "https://galactic-nemesis-7bee5-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "galactic-nemesis-7bee5",
            storageBucket: "galactic-nemesis-7bee5.firebasestorage.app",
            messagingSenderId: "265814903052",
            appId: "1:265814903052:web:6c59477e9852e91387a129"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const database = getDatabase(app);

        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = "login.html";
            } else {
                
                const myAdminUID = "n0W4WVJchQdRthpqZqvZrvblu653";
                let isAdmin = (user.uid === myAdminUID);
                
                if (isAdmin) {
                    document.getElementById("adminSection").style.display = "block";
                } else {
                    document.getElementById("adminSection").style.display = "none";
                }

                const pointsTable = { "1": 25, "2": 18, "3": 15, "4": 12, "5": 10, "6": 8, "7": 6, "8": 4, "9": 2, "10": 1 };
                
                function calculatePoints(pos) {
                    return pointsTable[pos] || 0;
                }

                let driversData = {};
                let adminGridRendered = false; // [SISTEMATO] Flag per impedire la distruzione della griglia durante il salvataggio

                // Sincronizzazione Realtime Firebase
                onValue(ref(database, 'horizon_championship/drivers'), (snapshot) => {
                    driversData = snapshot.val() || {};
                    let driversArray = [];
                    
                    Object.keys(driversData).forEach(id => {
                        let d = driversData[id];
                        let total = calculatePoints(d.g1_pos) + calculatePoints(d.g2_pos) + calculatePoints(d.g3_pos) +
                                    calculatePoints(d.g4_pos) + calculatePoints(d.g5_pos) + calculatePoints(d.g6_pos);
                        
                        driversArray.push({
                            id: id,
                            loginId: d.loginId,
                            gamertag: d.gamertag,
                            g1: d.g1_pos || "-", g2: d.g2_pos || "-", g3: d.g3_pos || "-",
                            g4: d.g4_pos || "-", g5: d.g5_pos || "-", g6: d.g6_pos || "-",
                            points: total
                        });
                    });

                    // Ordina la classifica
                    driversArray.sort((a, b) => b.points - a.points);

                    // Aggiornamento Tabella Pubblica (Fluido e in tempo reale)
                    const tableBody = document.getElementById('leaderboardBody');

                    driversArray.forEach((driver, index) => {
                        let tr = document.getElementById(`row_${driver.id}`);
                        let classePodio = "";
                        let testoPosizione = `#${index + 1}`;
                        
                        if (index === 0) { classePodio = "oro"; testoPosizione = `<span class="badge-podio">1st</span>`; }
                        else if (index === 1) { classePodio = "argento"; testoPosizione = `<span class="badge-podio">2nd</span>`; }
                        else if (index === 2) { classePodio = "bronzo"; testoPosizione = `<span class="badge-podio">3rd</span>`; }

                        if (!tr) {
                            tr = document.createElement('tr');
                            tr.id = `row_${driver.id}`;
                            tableBody.appendChild(tr);
                        }

                        tr.className = classePodio;
                        tr.innerHTML = `
                            <td class="pos-num">${testoPosizione}</td>
                            <td>${driver.loginId} <span style="font-size:0.75rem; color:#6b7180; font-weight:300;">(${driver.gamertag})</span></td>
                            <td style="text-align: center; color: var(--neon-blue);">${driver.g1}</td>
                            <td style="text-align: center; color: var(--neon-blue);">${driver.g2}</td>
                            <td style="text-align: center; color: var(--neon-blue);">${driver.g3}</td>
                            <td style="text-align: center; color: var(--horizon-pink);">${driver.g4}</td>
                            <td style="text-align: center; color: var(--horizon-pink);">${driver.g5}</td>
                            <td style="text-align: center; color: var(--horizon-pink);">${driver.g6}</td>
                            <td class="points-total">${driver.points} PTS</td>
                        `;
                        tableBody.appendChild(tr); // Esegue il riordinamento visivo (Sorpasso)
                    });

                    // [SISTEMATO] Renderizziamo la griglia admin SOLO la prima volta che carichiamo la pagina.
                    // Evita che la griglia si azzeri a metà mentre il ciclo di salvataggio sta scrivendo su Firebase.
                    if (isAdmin && !adminGridRendered) {
                        const adminContainer = document.getElementById('adminDriversContainer');
                        adminContainer.innerHTML = '';

                        driversArray.forEach(driver => {
                            let row = document.createElement('div');
                            row.className = 'admin-row';
                            row.innerHTML = `
                                <span>${driver.loginId}</span>
                                ${generateDropdownHTML('g1', driver.id, driver.g1)}
                                ${generateDropdownHTML('g2', driver.id, driver.g2)}
                                ${generateDropdownHTML('g3', driver.id, driver.g3)}
                                ${generateDropdownHTML('g4', driver.id, driver.g4)}
                                ${generateDropdownHTML('g5', driver.id, driver.g5)}
                                ${generateDropdownHTML('g6', driver.id, driver.g6)}
                            `;
                            adminContainer.appendChild(row);
                        });
                        adminGridRendered = true; // Griglia bloccata e pronta all'input di massa
                    }
                });

                // Funzione ausiliaria per generare i menu dropdown delle posizioni (1-12)
                function generateDropdownHTML(idGara, driverId, currentValue) {
                    let optionsHTML = `<option value="-" ${currentValue === '-' ? 'selected' : ''}>-</option>`;
                    for (let i = 1; i <= 12; i++) {
                        let strI = i.toString();
                        optionsHTML += `<option value="${strI}" ${currentValue === strI ? 'selected' : ''}>${i}</option>`;
                    }
                    return `<select id="${idGara}_${driverId}">${optionsHTML}</select>`;
                }

                // 💾 SALVATAGGIO MASSIVO UNIFICATO
                document.getElementById('btnUpdateScores').addEventListener('click', async () => {
                    try {
                        const btn = document.getElementById('btnUpdateScores');
                        const originalText = btn.innerText;
                        btn.innerText = "Salvataggio simultaneo...";
                        btn.disabled = true;

                        // Raccogliamo contemporaneamente tutti i dati aggiornati dai dropdown
                        const savePromises = Object.keys(driversData).map(async (id) => {
                            const g1 = document.getElementById(`g1_${id}`).value;
                            const g2 = document.getElementById(`g2_${id}`).value;
                            const g3 = document.getElementById(`g3_${id}`).value;
                            const g4 = document.getElementById(`g4_${id}`).value;
                            const g5 = document.getElementById(`g5_${id}`).value;
                            const g6 = document.getElementById(`g6_${id}`).value;

                            driversData[id].g1_pos = g1;
                            driversData[id].g2_pos = g2;
                            driversData[id].g3_pos = g3;
                            driversData[id].g4_pos = g4;
                            driversData[id].g5_pos = g5;
                            driversData[id].g6_pos = g6;

                            const driverRef = ref(database, `horizon_championship/drivers/${id}`);
                            return set(driverRef, driversData[id]);
                        });

                        // Eseguiamo il salvataggio in un colpo solo per tutti i giocatori
                        await Promise.all(savePromises);
                        
                        btn.innerText = originalText;
                        btn.disabled = false;
                        alert("Tutte le posizioni del campionato sono state aggiornate insieme con successo!");

                    } catch (error) {
                        alert("Errore critico durante il salvataggio massivo: " + error.message);
                        document.getElementById('btnUpdateScores').disabled = false;
                    }
                });

            }
        });
    </script>
</body>
</html>
