<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horizon 6 - Season Standings</title>
    <link rel="icon" type="image/png" href="https://www.vhv.rs/dpng/d/500-5007265_forza-png-forza-forza-motorsport-logo-png-transparent.png">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,700;1,900&display=swap" rel="stylesheet">
    <style>
        :root {
            --horizon-pink: #ff0055;
            --horizon-orange: #ff5500;
            --asphalt-dark: #0a0c10;
            --carbon-card: #141822;
            --neon-blue: #00f0ff;
            --neon-white: #f3f4f6;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
/* Contenitore principale del pannello Admin */
#adminDriversContainer {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 100%;
    margin-bottom: 20px;
}

/* La singola riga del pilota: diventa una griglia rigida */
.admin-row {
    display: grid;
    /* 1fr per il nome del pilota, e 6 colonne fisse da 50px per i piazzamenti */
    grid-template-columns: 2fr repeat(6, 55px);
    align-items: center;
    gap: 10px;
    background: rgba(255, 255, 255, 0.03);
    padding: 10px 15px;
    border-radius: 8px;
    border: 1px solid rgba(255, 255, 255, 0.05);
}

/* Stile del nome del pilota nella riga di inserimento */
.admin-row span {
    font-weight: 700;
    font-size: 0.9rem;
    color: var(--neon-white);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis; /* Se il nome è troppo lungo, mette i tre puntini invece di rompere la riga */
}

/* Stile dei 6 input dei piazzamenti */
.admin-row input {
    width: 100%;
    padding: 8px;
    background: rgba(0, 0, 0, 0.5);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 4px;
    color: #fff;
    font-weight: 700;
    text-align: center;
    font-size: 0.85rem;
    transition: border-color 0.2s;
}

/* Evidenzia il campo quando ci clicchi dentro per inserire il voto */
.admin-row input:focus {
    outline: none;
    border-color: var(--horizon-pink);
    background: rgba(255, 0, 85, 0.05);
}
        body {
            background-color: var(--asphalt-dark);
            background-image: radial-gradient(circle at 50% 0%, rgba(255, 0, 85, 0.15) 0%, transparent 60%);
            color: var(--neon-white);
            padding: 40px 20px;
            min-height: 100vh;
        }

        .container { max-width: 1100px; margin: 0 auto; }

        .header { text-align: center; margin-bottom: 40px; }
        .header h1 {
            font-weight: 900; font-size: 2.8rem; text-transform: uppercase; font-style: italic; letter-spacing: 2px;
            background: linear-gradient(45deg, #fff 30%, var(--horizon-pink) 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .header span { color: var(--horizon-orange); font-weight: 700; letter-spacing: 6px; text-transform: uppercase; font-size: 0.9rem; }

        /* Timeline dei due turni */
        .stage-title {
            grid-column: span 3; font-weight: 900; font-style: italic; text-transform: uppercase; 
            font-size: 0.9rem; letter-spacing: 2px; margin-bottom: 5px;
        }
        .stage-title.andata { color: var(--neon-blue); text-align: left; }
        .stage-title.ritorno { color: var(--horizon-pink); text-align: left; }

        .categories-info {
            display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; margin-bottom: 30px; text-align: center;
        }
        .cat-badge {
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); padding: 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase;
        }
        .cat-badge.and { border-top: 3px solid var(--neon-blue); }
        .cat-badge.rit { border-top: 3px solid var(--horizon-pink); }
        .cat-badge span { color: #888; font-size: 0.65rem; display: block; margin-top: 3px;}

        /* Tabella Classifica */
        .leaderboard-card {
            background: var(--carbon-card); border-radius: 12px; padding: 25px; box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.05); margin-bottom: 40px; overflow-x: auto;
        }
        
        table { width: 100%; border-collapse: collapse; text-align: left; min-width: 700px; }
        th { text-transform: uppercase; font-size: 0.7rem; color: #727888; padding: 12px; letter-spacing: 1px; }
        td { padding: 16px 12px; border-bottom: 1px solid rgba(255,255,255,0.05); font-weight: 700; font-size: 0.9rem; }
        
        .pos-num { font-style: italic; font-weight: 900; color: var(--horizon-orange); width: 40px; }
        tr:nth-child(1) .pos-num { color: #ffd700; font-size: 1.3rem; }
        tr:nth-child(2) .pos-num { color: #c0c0c0; }
        tr:nth-child(3) .pos-num { color: #cd7f32; }

        .points-total { color: var(--neon-blue); font-weight: 900; text-align: right; font-size: 1.1rem; }

        /* Pannello Direzione Gara (Admin) */
        .admin-panel {
            background: #11141c; border: 2px dashed rgba(255, 85, 0, 0.3); border-radius: 12px; padding: 30px;
        }
        .admin-panel h2 { font-style: italic; text-transform: uppercase; font-size: 1.2rem; margin-bottom: 20px; color: var(--horizon-orange); }
        
        .admin-row {
            display: grid; grid-template-columns: 2fr repeat(6, 1fr); gap: 10px; margin-bottom: 15px; align-items: center;
            background: rgba(0,0,0,0.2); padding: 10px 15px; border-radius: 6px;
        }
        .admin-row span { font-weight: 700; font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .admin-row input {
            background: #000; border: 1px solid rgba(255,255,255,0.1); border-radius: 4px; padding: 8px 4px; color: #fff; font-weight: 700; text-align: center; font-size: 0.85rem;
        }
        .admin-row input:focus { border-color: var(--horizon-pink); outline: none; }

        .btn-save {
            width: 100%; padding: 15px; background: linear-gradient(135deg, var(--horizon-pink) 0%, var(--horizon-orange) 100%);
            border: none; border-radius: 6px; color: white; font-weight: 900; text-transform: uppercase; font-style: italic; cursor: pointer; letter-spacing: 1px; transition: all 0.2s;
        }
        .btn-save:hover { filter: brightness(1.2); transform: translateY(-1px); }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>Horizon Apex Season</h1>
            <span>Campionato Andata & Ritorno</span>
        </div>

        <div class="categories-info">
            <div class="cat-badge and">G1 <span>Asfalto (A)</span></div>
            <div class="cat-badge and">G2 <span>Sterrato (A)</span></div>
            <div class="cat-badge and">G3 <span>Cross (A)</span></div>
            <div class="cat-badge rit">G4 <span>Asfalto (R)</span></div>
            <div class="cat-badge rit">G5 <span>Sterrato (R)</span></div>
            <div class="cat-badge rit">G6 <span>Cross (R)</span></div>
        </div>

        <div class="leaderboard-card">
            <table>
                <thead>
                    <tr>
                        <th>Pos</th>
                        <th>Pilota (Gamertag)</th>
                        <th style="text-align: center; color: var(--neon-blue);">G1</th>
                        <th style="text-align: center; color: var(--neon-blue);">G2</th>
                        <th style="text-align: center; color: var(--neon-blue);">G3</th>
                        <th style="text-align: center; color: var(--horizon-pink);">G4</th>
                        <th style="text-align: center; color: var(--horizon-pink);">G5</th>
                        <th style="text-align: center; color: var(--horizon-pink);">G6</th>
                        <th style="text-align: right;">Punti Live</th>
                    </tr>
                </thead>
                <tbody id="leaderboardBody">
                    </tbody>
            </table>
        </div>

        <div class="admin-panel">
            <h2>Direzione Gara: Inserimento Piazzamenti (Andata e Ritorno)</h2>
            <div style="display: grid; grid-template-columns: 2fr repeat(6, 1fr); gap: 10px; padding: 0 15px 10px 15px; font-size: 0.7rem; font-weight: 700; color: #6b7180; text-transform: uppercase;">
                <div>Pilota</div><div>G1 (A)</div><div>G2 (A)</div><div>G3 (A)</div><div>G4 (R)</div><div>G5 (R)</div><div>G6 (R)</div>
            </div>
            <div id="adminDriversContainer">
                </div>
            <button id="btnUpdateScores" class="btn-save">Salva Posizioni e Ricalcola Campionato</button>
        </div>
    </div>

    <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-auth.js"; // Aggiunto getAuth e onAuthStateChanged
    import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-database.js";

    const firebaseConfig = {
  apiKey: "AIzaSyDNRL0Rbo58WPjII0BzSRQZ1M7ZJ9MdsY4",
  authDomain: "galactic-nemesis-7bee5.firebaseapp.com",
  databaseURL: "https://galactic-nemesis-7bee5-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "galactic-nemesis-7bee5",
  storageBucket: "galactic-nemesis-7bee5.firebasestorage.app",
  messagingSenderId: "265814903052",
  appId: "1:265814903052:web:6c59477e9852e91387a129"
        };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app); // Inizializza l'autenticazione
    const database = getDatabase(app);

    // 🔒 BLOCCO DI PROTEZIONE: Controlla se l'utente è loggato
    onAuthStateChanged(auth, (user) => {
    if (!user) {
        // Se non è loggato, dritto alla pagina di login
        window.location.href = "login.html";
    } else {
        // 🛡️ CONTROLLO BODYGUARD: Tu sei l'Admin?
        const myAdminUID = "n0W4WVJchQdRthpqZqvZrvblu653"; // <-- Incolla qui il tuo codice tra le virgolette
        
        if (user.uid === myAdminUID) {
            // Se l'UID corrisponde, rendiamo visibile lo scatolone Admin
            document.getElementById("adminSection").style.display = "block";
        } else {
            // Se è un pilota normale, ci assicuriamo che rimanga nascosto
            document.getElementById("adminSection").style.display = "none";
        }
        // Sistema Punti F1/Horizon
        const pointsTable = { "1": 25, "2": 18, "3": 15, "4": 12, "5": 10, "6": 8, "7": 6, "8": 4, "9": 2, "10": 1 };
        
        function calculatePoints(pos) {
            return pointsTable[pos] || 0;
        }

        let driversData = {};
// CONTROLLO UID ADMIN
                // Rimpiazza questa stringa con il tuo vero UID che trovi su Firebase Authentication
                
                if (user.uid === myAdminUID) {
                    // Se sei tu, mostriamo lo scatolone dell'admin
                    document.getElementById('adminSection').style.display = "block";
                } else {
                    // Se è un amico, lo scatolone rimane invisibile
                    document.getElementById('adminSection').style.display = "none";
                }
        // Sincronizzazione in tempo reale con Firebase
        onValue(ref(database, 'horizon_championship/drivers'), (snapshot) => {
            driversData = snapshot.val() || {};
            
            let driversArray = [];
            Object.keys(driversData).forEach(id => {
                let d = driversData[id];
                
                // Calcolo complessivo distribuito su tutte e 6 le gare
                let total = calculatePoints(d.g1_pos) + calculatePoints(d.g2_pos) + calculatePoints(d.g3_pos) +
                            calculatePoints(d.g4_pos) + calculatePoints(d.g5_pos) + calculatePoints(d.g6_pos);
                
                driversArray.push({
                    id: id,
                    loginId: d.loginId,
                    gamertag: d.gamertag,
                    g1: d.g1_pos || "-", g2: d.g2_pos || "-", g3: d.g3_pos || "-",
                    g4: d.g4_pos || "-", g5: d.g5_pos || "-", g6: d.g6_pos || "-",
                    points: total
                });
            });

            // Ordinamento Meritocratico (Chi ha più punti sta sopra)
            driversArray.sort((a, b) => b.points - a.points);

            // Renering della Tabella Pubblica
            const tableBody = document.getElementById('leaderboardBody');
            tableBody.innerHTML = '';
            
            driversArray.forEach((driver, index) => {
                let tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="pos-num">#${index + 1}</td>
                    <td>${driver.loginId} <span style="font-size:0.75rem; color:#6b7180; font-weight:300;">(${driver.gamertag})</span></td>
                    <td style="text-align: center; color: var(--neon-blue);">${driver.g1}</td>
                    <td style="text-align: center; color: var(--neon-blue);">${driver.g2}</td>
                    <td style="text-align: center; color: var(--neon-blue);">${driver.g3}</td>
                    <td style="text-align: center; color: var(--horizon-pink);">${driver.g4}</td>
                    <td style="text-align: center; color: var(--horizon-pink);">${driver.g5}</td>
                    <td style="text-align: center; color: var(--horizon-pink);">${driver.g6}</td>
                    <td class="points-total">${driver.points} PTS</td>
                `;
                tableBody.appendChild(tr);
            });

            // Rendering della Griglia Input dell'Amministratore
            const adminContainer = document.getElementById('adminDriversContainer');
            adminContainer.innerHTML = '';

            driversArray.forEach(driver => {
                let row = document.createElement('div');
                row.className = 'admin-row';
                row.innerHTML = `
                    <span>${driver.loginId}</span>
                    <input type="text" id="g1_${driver.id}" placeholder="P" value="${driver.g1 === '-' ? '' : driver.g1}">
                    <input type="text" id="g2_${driver.id}" placeholder="P" value="${driver.g2 === '-' ? '' : driver.g2}">
                    <input type="text" id="g3_${driver.id}" placeholder="P" value="${driver.g3 === '-' ? '' : driver.g3}">
                    <input type="text" id="g4_${driver.id}" placeholder="P" value="${driver.g4 === '-' ? '' : driver.g4}">
                    <input type="text" id="g5_${driver.id}" placeholder="P" value="${driver.g5 === '-' ? '' : driver.g5}">
                    <input type="text" id="g6_${driver.id}" placeholder="P" value="${driver.g6 === '-' ? '' : driver.g6}">
                `;
                adminContainer.appendChild(row);
            });
        });

        // FIX EVENTO CLICK: Aggiornato con l'ID corretto "btnUpdateScores"
        // 💾 GESTIONE SALVATAGGIO VOTI ADMIN (CORRETTO E ASINCRONO)
document.getElementById('btnUpdateScores').addEventListener('click', async () => {
    try {
        // Mostriamo un feedback visivo immediato sul pulsante per dire che sta lavorando
        const btn = document.getElementById('btnUpdateScores');
        const originalText = btn.innerText;
        btn.innerText = "Salvataggio in corso...";
        btn.disabled = true;

        // Creiamo una lista di promesse di salvataggio
        const savePromises = Object.keys(driversData).map(async (id) => {
            
            // Recuperiamo i valori dai singoli input HTML della griglia admin
            const g1 = document.getElementById(`g1_${id}`).value.trim();
            const g2 = document.getElementById(`g2_${id}`).value.trim();
            const g3 = document.getElementById(`g3_${id}`).value.trim();
            const g4 = document.getElementById(`g4_${id}`).value.trim();
            const g5 = document.getElementById(`g5_${id}`).value.trim();
            const g6 = document.getElementById(`g6_${id}`).value.trim();

            // Aggiorniamo l'oggetto locale con le chiavi ESATTE usate dal database (_pos)
            // Se il campo è vuoto, rimettiamo il trattino "-"
            driversData[id].g1_pos = g1 === "" ? "-" : g1;
            driversData[id].g2_pos = g2 === "" ? "-" : g2;
            driversData[id].g3_pos = g3 === "" ? "-" : g3;
            driversData[id].g4_pos = g4 === "" ? "-" : g4;
            driversData[id].g5_pos = g5 === "" ? "-" : g5;
            driversData[id].g6_pos = g6 === "" ? "-" : g6;

            // Prepariamo il percorso specifico per questo pilota nel database
            const driverRef = ref(database, `horizon_championship/drivers/${id}`);
            
            // Inviamo l'aggiornamento a Firebase
            return set(driverRef, driversData[id]);
        });

        // 🔥 Aspettiamo che TUTTI i piloti siano stati salvati con successo su Firebase
        await Promise.all(savePromises);

        // Ripristiniamo il pulsante
        btn.innerText = originalText;
        btn.disabled = false;

        alert("Classifica aggiornata e salvata permanentemente sul Database!");

    } catch (error) {
        alert("Errore critico durante il salvataggio: " + error.message);
        console.error(error);
    }
});
        // Rendering Pannello Admin aggiornato e ordinato
const adminContainer = document.getElementById('adminDriversContainer');
if(adminContainer) {
    adminContainer.innerHTML = '';
    driversArray.forEach(driver => {
        let row = document.createElement('div');
        row.className = 'admin-row';
        row.innerHTML = `
            <span>${driver.loginId}</span>
            <input type="text" id="g1_${driver.id}" placeholder="G1" title="Gara 1" value="${driver.g1 === '-' ? '' : driver.g1}" maxlength="2">
            <input type="text" id="g2_${driver.id}" placeholder="G2" title="Gara 2" value="${driver.g2 === '-' ? '' : driver.g2}" maxlength="2">
            <input type="text" id="g3_${driver.id}" placeholder="G3" title="Gara 3" value="${driver.g3 === '-' ? '' : driver.g3}" maxlength="2">
            <input type="text" id="g4_${driver.id}" placeholder="G4" title="Gara 4" value="${driver.g4 === '-' ? '' : driver.g4}" maxlength="2">
            <input type="text" id="g5_${driver.id}" placeholder="G5" title="Gara 5" value="${driver.g5 === '-' ? '' : driver.g5}" maxlength="2">
            <input type="text" id="g6_${driver.id}" placeholder="G6" title="Gara 6" value="${driver.g6 === '-' ? '' : driver.g6}" maxlength="2">
        `;
        adminContainer.appendChild(row);
    });
}
    </script>
</body>
</html>
